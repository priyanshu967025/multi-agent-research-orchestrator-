services:
  # Django REST Backend Service
  - type: web
    name: multi-agent-research-backend
    runtime: python
    buildCommand: pip install -r requirements.txt && cd backend && python manage.py migrate && python manage.py collectstatic --noinput
    startCommand: cd backend && gunicorn orchestrator_backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "true"
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: MODEL_NAME
        value: "openai/gpt-oss-20b"
      - key: PYTHON_VERSION
        value: "3.12.0"

  # React + Vite Frontend Static Site
  - type: web
    name: multi-agent-research-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: multi-agent-research-backend
          property: host
