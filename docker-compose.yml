version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=false
      - CORS_ALLOW_ALL_ORIGINS=true
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - MODEL_NAME=openai/gpt-oss-20b
    volumes:
      - chroma_data:/app/rag/chroma_db
      - sqlite_data:/app/backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  chroma_data:
  sqlite_data:
