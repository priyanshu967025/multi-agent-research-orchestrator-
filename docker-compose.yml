version: '3.8'

services:
  django_backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: multi_agent_backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - MODEL_NAME=${MODEL_NAME:-llama-3.3-70b-versatile}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-production-secret-key-10-10}
      - DEBUG=False
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./django_backend/db.sqlite3:/app/django_backend/db.sqlite3
    restart: unless-stopped

  streamlit_frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: multi_agent_frontend
    ports:
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - MODEL_NAME=${MODEL_NAME:-llama-3.3-70b-versatile}
    depends_on:
      - django_backend
    restart: unless-stopped
